  <style>
    :root{
      --bg:#0b0b0e;
      --text:#f6f6f8;
      --accent:#ff5fa2; /* pink signature */
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .wrap{
      max-width:1000px;
      margin:0 auto;
      padding:22px;
    }

    /* BACK TO HOME */
    .topbar{
      margin:0 -22px 0;
      padding:16px 22px 10px;
      background:#050506;
      display:flex;
    }
    .back-home{
      color:#fff;
      background:#111;
      padding:.45rem .9rem;
      border-radius:9999px;
      text-decoration:none;
      font-weight:700;
      border:1px solid rgba(255,255,255,0.08);
    }
    .back-home:hover{ opacity:.9; }

    /* HEADER SIGNATURE */
    .header-bar{
      text-align:center;
      margin:0 -22px 28px;
      padding:16px 22px 22px;
      background:#050506;
    }
    .tilly-sig{
      font-family:'Great Vibes',cursive;
      font-size:78px;
      color:var(--accent);
    }

    /* VIDEO FRAME */
    .video-box{
      width:100%;
      max-width:900px;
      margin:0 auto;
      aspect-ratio:16/9;
      background:#000;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 8px 28px rgba(0,0,0,.55);
    }
    iframe{
      width:100%;
      height:100%;
      border:0;
    }

    /* SUBSCRIBE MESSAGE */
    .subscribe-note{
      margin:22px auto 0;
      text-align:center;
      font-size:1.1rem;
      color:#ff5fa2;
      font-family:'Great Vibes',cursive;
      font-size:36px;
    }
    .subscribe-small{
      font-size:1rem;
      color:#ccc;
      margin-top:6px;
      font-family:system-ui;
    }

    footer{
      text-align:center;
      font-size:.9rem;
      color:#8c8c9b;
      margin:40px 0 16px;
    }
  </style>

<div class="wrap">

  <div class="topbar">
